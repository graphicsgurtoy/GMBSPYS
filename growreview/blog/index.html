<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GrowReview Blog</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=Manrope:wght@600;700;800&display=swap" rel="stylesheet"><style>:root{--b:#4285f4;--r:#ea4335;--y:#fbbc05;--g:#34a853;--ink:#101828;--muted:#667085}*{box-sizing:border-box}body{margin:0;font-family:'DM Sans',sans-serif;color:var(--ink);background:#f8fafc}header{height:72px;background:#fff;border-bottom:1px solid #e7ebf1;display:flex;align-items:center}header div,main{width:min(880px,calc(100% - 28px));margin:auto}.brand{font:900 25px 'Manrope';background:linear-gradient(90deg,var(--b),var(--r),var(--y),var(--g));-webkit-background-clip:text;color:transparent;text-decoration:none}main{padding:55px 0 90px}.cover{width:100%;max-height:440px;object-fit:cover;border-radius:28px;margin-bottom:30px}small{font-weight:900;letter-spacing:.14em;color:var(--b)}h1{font:800 clamp(40px,6vw,68px)/1 'Manrope';letter-spacing:-.055em;margin:12px 0 20px}#excerpt{font-size:20px;line-height:1.6;color:var(--muted)}article{font-size:17px;line-height:1.8;color:#344054;white-space:pre-wrap;margin-top:35px;padding-top:30px;border-top:1px solid #e5eaf1}.back{display:inline-flex;margin-top:30px;border:1px solid #dfe5ed;background:#fff;border-radius:14px;padding:11px 14px;text-decoration:none;color:#111827;font-weight:800}</style></head><body><header><div><a class="brand" href="/">GrowReview</a></div></header><main id="app"><div>Loading…</div></main><script>const slug=new URLSearchParams(location.search).get('slug')||location.pathname.split('/').filter(Boolean)[1]||'';fetch('/api/public/blog.php?slug='+encodeURIComponent(slug)).then(r=>r.json()).then(d=>{if(!d.ok)throw new Error(d.error);const b=d.blog;document.title=b.title+' · GrowReview';app.innerHTML=`${b.cover_image?`<img class="cover" src="${b.cover_image}" alt="">`:''}<small>${b.category||'GROWTH'}</small><h1>${b.title}</h1><p id="excerpt">${b.excerpt||''}</p><article>${b.content||''}</article><a class="back" href="/#blogs">← Back to GrowReview</a>`}).catch(e=>app.innerHTML='<h1>Blog not found</h1><p>'+e.message+'</p><a class="back" href="/">Back home</a>')</script></body></html>
