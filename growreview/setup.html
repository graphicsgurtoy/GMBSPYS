<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GrowReview Setup</title><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="/assets/css/portal.css"></head><body class="auth-bg"><main class="auth-card"><div class="gr-word">GrowReview</div><span class="pill">FIRST-TIME SETUP</span><h1>Create Super Admin</h1><p>This page works only until the first GrowReview super admin is created.</p><form id="setupForm"><label>Name<input name="name" required></label><label>Email<input name="email" type="email" required></label><label>Password<input name="password" type="password" minlength="10" required placeholder="Minimum 10 characters"></label><button class="primary" type="submit">Create Super Admin</button></form><div id="msg" class="msg"></div><a href="/super-admin">Already created? Open Super Admin</a></main><script src="/assets/js/api.js"></script><script>setupForm.onsubmit=async e=>{e.preventDefault();msg.textContent='Creating…';try{const d=Object.fromEntries(new FormData(setupForm));await GRAPI.request('/api/auth/setup-super-admin.php',{method:'POST',body:JSON.stringify(d)});msg.textContent='Created. Redirecting…';setTimeout(()=>location.href='/super-admin',800)}catch(err){msg.textContent=err.message}}</script></body></html>
