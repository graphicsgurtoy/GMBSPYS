<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>GMBSPYS</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            width: 380px;
            min-height: 500px;
            font-family: Arial, sans-serif;
            background: #f5f7fb;
            color: #111827;
        }

        .container {
            padding: 24px;
        }

        .logo {
            font-size: 28px;
            font-weight: 800;
            margin-bottom: 5px;
        }

        .tagline {
            color: #6b7280;
            font-size: 13px;
            margin-bottom: 28px;
        }

        .card {
            background: white;
            border-radius: 16px;
            padding: 22px;
            box-shadow: 0 5px 25px rgba(0,0,0,.07);
        }

        h2 {
            margin: 0 0 7px;
            font-size: 21px;
        }

        .sub {
            color: #6b7280;
            font-size: 13px;
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 7px;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #d1d5db;
            border-radius: 9px;
            font-size: 14px;
            margin-bottom: 15px;
            outline: none;
        }

        input:focus {
            border-color: #111827;
        }

        button {
            width: 100%;
            border: 0;
            border-radius: 9px;
            padding: 12px;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
        }

        #loginBtn,
        #signupBtn {
            background: #111827;
            color: white;
        }

        #signupBtn {
            margin-top: 10px;
            background: #eef2ff;
            color: #111827;
        }

        #logoutBtn {
            background: #fee2e2;
            color: #991b1b;
            margin-top: 15px;
        }

        .message {
            display: none;
            margin-top: 15px;
            padding: 11px;
            border-radius: 8px;
            font-size: 12px;
        }

        .error {
            background: #fee2e2;
            color: #991b1b;
        }

        .success {
            background: #dcfce7;
            color: #166534;
        }

        .user-card {
            text-align: center;
        }

        .avatar {
            width: 65px;
            height: 65px;
            border-radius: 50%;
            background: #111827;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            font-weight: 800;
            margin: 0 auto 15px;
        }

        .email {
            color: #6b7280;
            font-size: 13px;
            margin: 5px 0 20px;
        }

        .dashboard {
            display: block;
            text-align: center;
            text-decoration: none;
            background: #111827;
            color: white;
            padding: 12px;
            border-radius: 9px;
            font-weight: 700;
            font-size: 14px;
        }

        #loading {
            display: none;
            text-align: center;
            font-size: 13px;
            color: #6b7280;
            margin-top: 10px;
        }
    </style>
</head>

<body>

<div class="container">

    <div class="logo">GMBSPYS</div>

    <div class="tagline">
        Google Maps Lead Finder
    </div>

    <!-- LOGIN -->
    <div id="loginSection" class="card">

        <h2>Welcome Back</h2>

        <div class="sub">
            Login to your GMBSPYS account
        </div>

        <label>Email</label>

        <input
            type="email"
            id="email"
            placeholder="you@example.com"
            autocomplete="email"
        >

        <label>Password</label>

        <input
            type="password"
            id="password"
            placeholder="••••••••"
            autocomplete="current-password"
        >

        <button id="loginBtn">
            Login to GMBSPYS
        </button>

        <button id="signupBtn">
            Create New Account
        </button>

        <div id="loading">
            Please wait...
        </div>

        <div id="message" class="message"></div>

    </div>

    <!-- LOGGED IN -->
    <div id="userSection" class="card user-card" style="display:none">

        <div class="avatar" id="avatar">
            G
        </div>

        <h2>You're Logged In</h2>

        <div class="email" id="userEmail"></div>

        <a
            class="dashboard"
            href="https://gmbspys.vercel.app/"
            target="_blank"
        >
            Open GMBSPYS Dashboard
        </a>

        <button id="logoutBtn">
            Logout
        </button>

        <div id="userMessage" class="message"></div>

    </div>

</div>

<script src="auth/supabase-config.js"></script>
<script src="auth/supabase-auth.js"></script>
<script src="js/gmbspys-login.js"></script>

</body>
</html>
