<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>GMBSPYS</title>
<link href="css/style.css" rel="stylesheet">
<link href="css/contentScript.css" rel="stylesheet">
<style>
body{width:520px;min-height:420px;background:#fff;color:#111827}
#content{padding:18px 22px}
.gmb-header{display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #e5e7eb;padding-bottom:14px}
.gmb-brand{font-size:24px;font-weight:800;letter-spacing:-.5px}
.gmb-sub{font-size:12px;color:#667085;margin-top:3px}
.gmb-card{margin-top:18px;border:1px solid #e5e7eb;border-radius:14px;padding:18px;background:#fff}
.gmb-label{font-size:13px;font-weight:700;margin-bottom:7px;display:block}
.gmb-input{width:100%;box-sizing:border-box;padding:11px 12px;border:1px solid #d0d5dd;border-radius:9px;font-size:14px}
.gmb-btn{border:0;border-radius:9px;padding:11px 16px;font-weight:700;cursor:pointer}
.gmb-primary{background:#111827;color:#fff}
.gmb-secondary{background:#eef2f6;color:#111827}
.gmb-danger{background:#fee2e2;color:#991b1b}
.gmb-row{display:flex;gap:10px;align-items:center}
.gmb-status{font-size:12px;margin-top:9px}
.gmb-muted{color:#667085}
#gmbLoggedIn{display:none}
#loading{display:none;color:#667085;font-size:12px}
</style>
</head>
<body>
<div id="maincontent" style="width:100%">
<div id="content">
  <div class="gmb-header">
    <div>
      <div class="gmb-brand">GMBSPYS</div>
      <div class="gmb-sub">Google Maps Lead Finder</div>
    </div>
    <div id="userBadge" class="gmb-muted"></div>
  </div>

  <div id="gmbLogin" class="gmb-card">
    <h3 style="margin-top:0">Login to GMBSPYS</h3>
    <label class="gmb-label">Email</label>
    <input class="gmb-input" id="email" type="email" autocomplete="username" placeholder="you@example.com">
    <div style="height:10px"></div>
    <label class="gmb-label">Password</label>
    <input class="gmb-input" id="password" type="password" autocomplete="current-password" placeholder="Password">
    <div style="height:14px"></div>
    <div class="gmb-row">
      <button id="loginBtn" class="gmb-btn gmb-primary">Login</button>
      <button id="openDashboardBtn1" class="gmb-btn gmb-secondary">Dashboard</button>
    </div>
    <div id="loading">Signing in...</div>
    <div id="loginMessage" class="gmb-status"></div>
  </div>

  <div id="gmbLoggedIn" class="gmb-card">
    <div class="gmb-row" style="justify-content:space-between">
      <div>
        <strong>You're logged in</strong>
        <div id="loggedEmail" class="gmb-muted" style="margin-top:4px"></div>
      </div>
      <button id="logoutBtn" class="gmb-btn gmb-danger">Logout</button>
    </div>
    <div style="height:18px"></div>
    <label class="gmb-label">Google Maps Search</label>
    <div class="gmb-row">
      <input class="gmb-input" style="flex:1" id="profileid" value="dentist in Ludhiana" placeholder="e.g. salons in Ludhiana">
      <button id="addprofilebtn" class="gmb-btn gmb-primary">Search Maps</button>
    </div>
    <p class="gmb-muted" style="font-size:12px;margin-bottom:0">
      Open Google Maps, then use <b>Start Auto Extract</b> to collect businesses.
    </p>
    <div style="height:14px"></div>
    <div class="gmb-row">
      <button id="openDashboardBtn" class="gmb-btn gmb-secondary">Open GMBSPYS Dashboard</button>
      <button id="openExportBtn" class="gmb-btn gmb-secondary">Export Local Data</button>
    </div>
    <div id="appMessage" class="gmb-status"></div>
  </div>
</div>
</div>
<script src="auth/supabase-config.js"></script>
<script src="auth/supabase-auth.js"></script>
<script src="js/popup.js"></script>
<script src="js/gmbspys-popup.js"></script>
</body>
</html>
